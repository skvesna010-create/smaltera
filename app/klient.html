<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ваш ремонт — Домилия</title>
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" type="image/png" sizes="120x120" href="/favicon-120x120.png"><link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--ink:#16191B;--muted:#5E666A;--line:#E3E6E5;--bg:#F4F5F4;--g:#00B47E;--g2:#007A55;--gl:#E6F6F0}
*{box-sizing:border-box}body{margin:0;font:500 15px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
.top{background:#16191B;color:#fff;padding:18px 20px 70px}.top .in{max-width:720px;margin:0 auto;display:flex;align-items:center;gap:12px}
.mk{width:44px;height:44px;background:#fff;border-radius:12px;padding:5px;flex:none}.mk svg{width:100%;height:100%}
.br b{font-size:17px;letter-spacing:.08em}.br small{display:block;color:#9AA3A7;font-size:12.5px}
.wrap{max-width:720px;margin:-52px auto 40px;padding:0 14px;display:grid;gap:14px}
.card{background:#fff;border-radius:18px;padding:20px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
h1{font-size:21px;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}.muted{color:var(--muted);font-size:13.5px}
.st{display:inline-block;background:var(--gl);color:var(--g2);font-weight:700;font-size:13px;border-radius:99px;padding:4px 12px;margin-top:8px}
.pg{display:flex;align-items:center;gap:16px;margin-top:16px}.ring{width:84px;height:84px;flex:none}.pg b{font-size:28px}
.bar{height:10px;background:var(--bg);border-radius:9px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--g)}
.stg{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line);align-items:flex-start}.stg:first-of-type{border-top:0}
.dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-size:13px;font-weight:800;color:#fff}.stg.d .dot{background:var(--g);border-color:var(--g)}
.stg div{flex:1}.stg small{display:block;color:var(--muted);font-size:12.5px}.stg .s{font-weight:700;white-space:nowrap}
.money{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.money div{background:var(--bg);border-radius:12px;padding:12px}.money b{display:block;font-size:17px}.money span{font-size:12px;color:var(--muted)}
.money .p b{color:var(--g2)}
details{border-top:1px solid var(--line);padding:10px 0}details:first-of-type{border-top:0}summary{display:flex;justify-content:space-between;cursor:pointer;font-weight:700;list-style:none}summary::-webkit-details-marker{display:none}
.ln{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;padding:5px 0;color:#333}.ln.d{color:var(--g2)}.ln span:last-child{white-space:nowrap}
.tot{display:flex;justify-content:space-between;font-size:18px;font-weight:800;border-top:2px solid var(--ink);margin-top:8px;padding-top:10px}
.note{background:var(--gl);border-radius:14px;padding:14px 16px;font-weight:600}
.ct{display:flex;gap:10px;flex-wrap:wrap}.ct a{flex:1;min-width:150px;text-align:center;text-decoration:none;background:var(--g2);color:#fff;font-weight:700;padding:13px;border-radius:12px}.ct a.l{background:#fff;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--line)}
.err{text-align:center;padding:40px 20px}
@media (max-width:480px){.money{grid-template-columns:1fr 1fr}.money div:last-child{grid-column:1/-1}}
</style>
<meta name="yandex-verification" content="42009f9754284897" /></head>
<body>
<div class="top"><div class="in"><div class="mk"><svg xmlns="http://www.w3.org/2000/svg" viewBox="30 26 418 415"><defs><linearGradient id="gG" x1="0" y1="0" x2="0.35" y2="1"><stop offset="0" stop-color="#1FE6AA"/><stop offset=".45" stop-color="#00B47E"/><stop offset="1" stop-color="#006C4C"/></linearGradient><linearGradient id="gBand" x1="55" y1="432" x2="351" y2="300" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#00B47E"/><stop offset=".55" stop-color="#14D69C"/><stop offset="1" stop-color="#2A4A42"/></linearGradient><linearGradient id="gRoof" x1="290" y1="36" x2="400" y2="160" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#4A4F53"/><stop offset=".7" stop-color="#7C8488"/><stop offset="1" stop-color="#5C6367"/></linearGradient><linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A6064"/><stop offset="1" stop-color="#2B2F32"/></linearGradient><linearGradient id="gLow" x1="230" y1="300" x2="420" y2="430" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3A4044"/><stop offset="1" stop-color="#0E1011"/></linearGradient><linearGradient id="gLeg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4C5357"/><stop offset="1" stop-color="#16191B"/></linearGradient></defs><path fill="url(#gLow)" d="M208,431 L351,328 L351,286 L438,252 L438,363 L351,431 Z"/><path fill="url(#gSide)" d="M351,179 L438,129 L438,252 L351,286 Z"/><path fill="url(#gRoof)" d="M290,36 L438,129 L351,179 L290,143 Z"/><path fill="url(#gG)" d="M208,94 L290,36 L290,143 Z"/><path fill="url(#gBand)" d="M55,432 L351,286 L351,328 L208,431 Z"/><path fill="url(#gG)" d="M202,94 L112,159 L112,390 L150,370 L150,182 L202,145 Z"/><path fill="url(#gLeg)" d="M202,145 L166,170 L166,363 L202,343 Z"/><path fill="#0C3A2B" d="M150,214 L154,212 L154,368 L150,370 Z"/><path fill="url(#gG)" d="M95,221 L40,257 L40,427 L95,398 Z"/><path fill="#0C3A2B" d="M95,221 L99,226 L99,396 L95,398 Z"/></svg>
</div><div class="br"><b id="co">ДОМИЛИЯ</b><small>Личный кабинет заказчика</small></div></div></div>
<div class="wrap" id="app"><div class="card err">Загружаю данные объекта…</div></div>
<script>
(function(){
  function e(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }
  function rub(n){ return Math.round(n || 0).toLocaleString('ru-RU') + ' ₽'; }

  function unpack(p){ var t = p[0], b = u8(p.slice(1)); if (t === 'j') return Promise.resolve(JSON.parse(new TextDecoder().decode(b))); var ds = new Blob([b]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Response(ds).text().then(JSON.parse); }
  var app = document.getElementById('app'), p = (location.hash || '').slice(1);
  if (!p){ app.innerHTML = '<div class="card err">Ссылка неполная. Попросите менеджера прислать её ещё раз.</div>'; return; }
  unpack(p).then(function(d){
    document.getElementById('co').textContent = (d.co.n || 'Домилия').toUpperCase(); document.title = d.o.n + ' — ' + d.co.n;
    var done = d.stg.reduce(function(a, s){ return a + (s[2] ? s[1] : 0); }, 0), C = 2 * Math.PI * 34, H = '';
    H += '<div class="card"><div class="muted">Объект №' + e(d.o.num) + (d.cl ? ' · ' + e(d.cl) : '') + '</div><h1>' + e(d.o.n) + '</h1>' + (d.o.a && d.o.a !== d.o.n ? '<div class="muted">' + e(d.o.a) + '</div>' : '') + '<span class="st">' + e(d.o.st) + '</span>' +
      '<div class="pg"><svg class="ring" viewBox="0 0 80 80"><circle cx="40" cy="40" r="34" fill="none" stroke="#EEF0EF" stroke-width="9"/><circle cx="40" cy="40" r="34" fill="none" stroke="#00B47E" stroke-width="9" stroke-linecap="round" stroke-dasharray="' + (C * done / 100) + ' ' + C + '" transform="rotate(-90 40 40)"/></svg><div><b>' + done + '%</b><div class="muted">готовность объекта' + (d.o.e ? '<br>сдача по плану: ' + fd(d.o.e) : '') + '</div></div></div></div>';
    if (d.note) H += '<div class="note">' + e(d.note) + '</div>';
    H += '<div class="card"><h2>Этапы работ</h2>' + d.stg.map(function(s, i){ return '<div class="stg' + (s[2] ? ' d' : '') + '"><span class="dot">' + (s[2] ? '✓' : '') + '</span><div>' + e(s[0]) + '<small>' + (s[2] ? 'выполнен' : s[4] ? 'по плану до ' + fd(s[4]) : 'впереди') + (s[3] ? ' · оплачен' : '') + '</small></div><span class="s">' + rub(d.tot * s[1] / 100) + '</span></div>'; }).join('') + '</div>';
    var left = d.tot - d.inc;
    H += '<div class="card"><h2>Оплата</h2><div class="money"><div><b>' + rub(d.tot) + '</b><span>стоимость по смете</span></div><div class="p"><b>' + rub(d.inc) + '</b><span>оплачено</span></div><div><b>' + rub(Math.max(0, left)) + '</b><span>осталось</span></div></div><div class="bar"><i style="width:' + Math.min(100, d.tot ? d.inc / d.tot * 100 : 0) + '%"></i></div></div>';

      (d.mats ? '<div class="ln"><span>Материалы</span><span>' + rub(d.mats) + '</span></div>' : '') + (d.disc ? '<div class="ln"><span>Скидка</span><span>−' + rub(d.disc) + '</span></div>' : '') + '<div class="tot"><span>Итого</span><span>' + rub(d.tot) + '</span></div></div>';

    app.innerHTML = H;
  }).catch(function(){ app.innerHTML = '<div class="card err">Не удалось открыть ссылку. Попросите менеджера прислать её ещё раз.<br><small class="muted">Откройте в Chrome, Safari или Яндекс Браузере.</small></div>'; });
